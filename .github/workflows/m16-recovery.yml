name: RADICH M16 PostgreSQL crash recovery

on:
  pull_request:
  push:
    branches: [main]

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radich
          POSTGRES_PASSWORD: ci-recovery-password
          POSTGRES_DB: radich
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radich -d radich"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RADICH_TEST_DATABASE_URL: postgresql://radich:ci-recovery-password@localhost:5432/radich
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RADICH with PostgreSQL support
        run: python -m pip install -e ".[postgres]" pytest
      - name: Run M16 PostgreSQL checkpoint and crash tests without skips
        run: |
          python -m pytest -q tests/test_m16_postgres_checkpoints.py tests/test_m16_crash_restart.py -rs
          python - <<'PY'
          import subprocess, sys
          cmd = [sys.executable, "-m", "pytest", "-q",
                 "tests/test_m16_postgres_checkpoints.py", "tests/test_m16_crash_restart.py",
                 "-r", "s"]
          output = subprocess.run(cmd, capture_output=True, text=True)
          print(output.stdout)
          if output.returncode != 0 or "skipped" in output.stdout.lower():
              print(output.stderr)
              raise SystemExit("M16 PostgreSQL tests failed or were skipped")
          PY
