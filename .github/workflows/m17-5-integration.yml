name: RADICH M17.5 API and PostgreSQL recovery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  m17-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radich
          POSTGRES_PASSWORD: ci-m17-only
          POSTGRES_DB: radich
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radich -d radich"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RADICH_TEST_DATABASE_URL: postgresql://radich:ci-m17-only@localhost:5432/radich
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RADICH and test dependencies
        run: python -m pip install -e ".[test,api,api-test,postgres]"
      - name: M17.5 integration must pass against real PostgreSQL without skips
        run: |
          python -m pytest -q tests/test_m17_5_api.py tests/test_m17_5_postgres.py -rs | tee /tmp/m17_5_tests.txt
          if grep -qi "skipped" /tmp/m17_5_tests.txt; then
            echo "M17.5 tests must not be skipped in the PostgreSQL workflow"
            exit 1
          fi
