name: RADICH M09 PostgreSQL integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radich
          POSTGRES_PASSWORD: radich_ci_only
          POSTGRES_DB: radich_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radich -d radich_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RADICH_TEST_DATABASE_URL: postgresql://radich:radich_ci_only@localhost:5432/radich_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[test,postgres,api,api-test]'
      - name: Run all tests including PostgreSQL
        run: python -m pytest -q
